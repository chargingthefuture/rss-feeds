<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>https://chargingthefuture.github.io/rss-feeds/watch/</title>
  <meta property="og:title" content="https://chargingthefuture.github.io/rss-feeds/watch/">
  <meta property="og:url" content="https://chargingthefuture.github.io/rss-feeds/watch/">
  <meta name="theme-color" content="#111111">
  <!--
    The watch page. One file, no build step, no account: it reads the per-channel lists the
    build writes beside it (data/*.json) and keeps what you have watched in this browser only.

    Nothing is marked watched until the Watched button is pressed. Opening a video, playing it,
    scrolling past it or reloading the page changes nothing. A channel reopens at the video last
    opened, or the page last viewed, whichever came later.

    Lists are paged, never an endless scroll, with the page number in the address so reload and
    the back button keep your place.

    Nothing loads from YouTube until a player is opened: no thumbnails, no scripts.
  -->
  <style>
    :root {
      --bg: #ffffff; --fg: #111111; --muted: #5c5c5c; --line: #e4e4e4; --card: #f6f6f6;
      --accent: #c2410c; --accent-fg: #ffffff; --focus: #2563eb; --here: #fff4e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111111; --fg: #f2f2f2; --muted: #a3a3a3; --line: #2a2a2a; --card: #1b1b1b;
        --accent: #fb923c; --accent-fg: #111111; --focus: #93c5fd; --here: #2a1d10;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 44rem; margin: 0 auto; padding: 0 16px 6rem; }
    header.bar {
      position: sticky; top: 0; z-index: 5; background: var(--bg);
      border-bottom: 1px solid var(--line); padding: 10px 16px;
      display: flex; align-items: center; gap: 10px; min-height: 56px;
    }
    header.bar h1 { font-size: 1.1rem; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header.bar .sub { color: var(--muted); font-size: .9rem; white-space: nowrap; }
    a { color: inherit; }
    button, .btn {
      font: inherit; font-size: .95rem; min-height: 44px; padding: 0 14px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; text-decoration: none; gap: 6px;
    }
    button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
    button:disabled { opacity: .4; cursor: default; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    ul.plain { list-style: none; margin: 0; padding: 0; }
    .channels li a {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 14px 4px; border-bottom: 1px solid var(--line); text-decoration: none; min-height: 56px;
    }
    .channels .name { font-weight: 600; overflow-wrap: anywhere; }
    .channels .left { color: var(--muted); font-size: .9rem; white-space: nowrap; }
    .channels .done .name { color: var(--muted); font-weight: 400; }
    .continue { display: block; margin: 16px 0 4px; padding: 14px; border-radius: 12px; background: var(--here); text-decoration: none; }
    .continue small { display: block; color: var(--muted); }
    .range { color: var(--muted); font-size: .9rem; margin: 14px 0 8px; }
    .videos li { border-bottom: 1px solid var(--line); padding: 14px 0; }
    .videos li.here { background: var(--here); margin: 0 -16px; padding: 14px 16px; }
    .videos li.here::before { content: "You were here"; display: block; font-size: .8rem; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
    .videos .title { font-weight: 600; overflow-wrap: anywhere; text-decoration: none; display: block; }
    .videos .title:visited { color: var(--muted); }
    .videos .meta { color: var(--muted); font-size: .88rem; margin: 4px 0 10px; }
    .videos .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .player { position: relative; width: 100%; aspect-ratio: 16 / 9; margin-top: 10px; background: #000; border-radius: 10px; overflow: hidden; }
    .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    nav.pager { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin: 18px 0; flex-wrap: wrap; }
    nav.pager select { font: inherit; min-height: 44px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .empty { color: var(--muted); padding: 2rem 0; }
    details { margin-top: 2.5rem; border-top: 1px solid var(--line); padding-top: 1rem; }
    summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; }
    textarea { width: 100%; min-height: 8rem; font: 13px/1.4 ui-monospace, monospace; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
    .note { color: var(--muted); font-size: .9rem; }
    #toast {
      position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      background: var(--fg); color: var(--bg); padding: 8px 8px 8px 16px; border-radius: 12px;
      display: none; align-items: center; gap: 12px; max-width: calc(100% - 32px); z-index: 10;
    }
    #toast.show { display: flex; }
    #toast button { background: transparent; color: var(--bg); border-color: transparent; font-weight: 700; text-decoration: underline; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <header class="bar" id="bar"></header>
  <main id="main" tabindex="-1"><p class="empty">Loading…</p></main>
  <div id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" id="toast-undo">Undo</button></div>

  <script>
  (() => {
    'use strict';
    const PER_PAGE = 50;
    const KEY = 'rss-feeds-watch-v1';
    const bar = document.getElementById('bar');
    const main = document.getElementById('main');

    // ---------- saved state (this browser only) ----------
    // watched: { slug: { videoId: 'YYYY-MM-DD' } }
    // pos:     { slug: { id?: videoId, page?: n, t: ms } }  — the later of the two wins
    // order:   { slug: 'new' | 'old' }
    // recent:  slug of the channel opened last
    function blank() { return { watched: {}, pos: {}, order: {}, recent: null }; }
    function load() {
      try {
        const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (!raw || typeof raw !== 'object') return blank();
        return { watched: raw.watched || {}, pos: raw.pos || {}, order: raw.order || {}, recent: raw.recent || null };
      } catch { return blank(); }
    }
    let state = load();
    let storageOk = true;
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; }
      catch { storageOk = false; }
    }
    // Another tab marked something watched: pick it up.
    window.addEventListener('storage', (e) => { if (e.key === KEY) { state = load(); route(); } });

    const watchedOf = (slug) => (state.watched[slug] ||= {});
    const today = () => new Date().toISOString().slice(0, 10);

    // ---------- data ----------
    let index = null;
    const cache = new Map();
    async function getIndex() {
      if (!index) {
        const r = await fetch('data/channels.json', { cache: 'no-cache' });
        if (!r.ok) throw new Error(`The channel list did not load (HTTP ${r.status}).`);
        index = await r.json();
      }
      return index;
    }
    async function getChannel(slug) {
      if (!cache.has(slug)) {
        const r = await fetch(`data/${encodeURIComponent(slug)}.json`, { cache: 'no-cache' });
        if (!r.ok) throw new Error(`This channel's list did not load (HTTP ${r.status}).`);
        const c = await r.json();
        // Rows are [id, title, date, approximate, seconds], newest first.
        c.list = c.videos.map(([id, title, date, approx, secs]) => ({ id, title, date, approx: !!approx, secs }));
        cache.set(slug, c);
      }
      return cache.get(slug);
    }

    // ---------- helpers ----------
    function el(tag, attrs, ...kids) {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (v === undefined || v === null || v === false) continue;
        if (k === 'on') for (const [ev, fn] of Object.entries(v)) n.addEventListener(ev, fn);
        else if (k === 'class') n.className = v;
        else n.setAttribute(k, v === true ? '' : v);
      }
      for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) n.append(kid);
      return n;
    }
    const n0 = (n) => n.toLocaleString('en-US');
    function duration(secs) {
      if (!secs) return '';
      const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
      return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
    }
    function niceDate(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      if (!y) return iso;
      return new Date(Date.UTC(y, m - 1, d, 12)).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
    }
    const watchUrl = (id) => `https://www.youtube.com/watch?v=${encodeURIComponent(id)}`;

    let toastTimer = null;
    function toast(text, undo) {
      const t = document.getElementById('toast');
      document.getElementById('toast-text').textContent = text;
      const b = document.getElementById('toast-undo');
      b.style.display = undo ? '' : 'none';
      b.onclick = () => { t.classList.remove('show'); if (undo) undo(); };
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 7000);
    }

    // ---------- routing: #/  or  #/c/<slug>  or  #/c/<slug>?page=N ----------
    function parse() {
      const h = location.hash.replace(/^#/, '');
      const m = h.match(/^\/c\/([^?]+)(?:\?page=(\d+))?$/);
      if (m) return { view: 'channel', slug: decodeURIComponent(m[1]), page: m[2] ? Number(m[2]) : null };
      return { view: 'home' };
    }
    window.addEventListener('hashchange', route);
    async function route() {
      const r = parse();
      try {
        if (r.view === 'channel') await showChannel(r.slug, r.page);
        else await showHome();
      } catch (err) {
        bar.replaceChildren(el('h1', {}, 'Something did not load'));
        main.replaceChildren(
          el('p', {}, String(err && err.message ? err.message : err)),
          el('p', {}, 'Check the connection and reload. Your watched list is kept in this browser and is not affected.'),
          el('p', {}, el('a', { href: '#/' }, 'Back to channels')),
        );
      }
    }

    // ---------- home: channels A to Z ----------
    async function showHome() {
      const idx = await getIndex();
      document.title = 'Watch';
      bar.replaceChildren(el('h1', {}, 'Channels'), el('span', { class: 'sub' }, `${idx.channels.length} channels`));

      const channels = idx.channels.slice().sort((a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'base' }));
      const leftOf = (c) => Math.max(0, c.count - Object.keys(state.watched[c.slug] || {}).length);

      const parts = [];
      const recent = state.recent && channels.find((c) => c.slug === state.recent);
      if (recent) {
        parts.push(el('a', { class: 'continue', href: `#/c/${encodeURIComponent(recent.slug)}` },
          el('strong', {}, `Pick up in ${recent.name}`),
          el('small', {}, `${n0(leftOf(recent))} not yet watched`)));
      }
      parts.push(el('ul', { class: 'plain channels' }, channels.map((c) => {
        const left = leftOf(c);
        return el('li', { class: left === 0 ? 'done' : '' },
          el('a', { href: `#/c/${encodeURIComponent(c.slug)}` },
            el('span', { class: 'name' }, c.name),
            el('span', { class: 'left' }, left === 0 ? 'All watched' : `${n0(left)} left`)));
      })));
      parts.push(backupSection());
      parts.push(el('p', { class: 'note' },
        'What a listing here means: ', el('a', { href: '../' }, 'the disclaimer'), '.'));
      main.replaceChildren(...parts);
      window.scrollTo(0, 0);
    }

    // ---------- one channel, paged ----------
    async function showChannel(slug, pageFromUrl) {
      const c = await getChannel(slug);
      state.recent = slug; save();
      const order = state.order[slug] === 'old' ? 'old' : 'new';
      const all = order === 'old' ? c.list.slice().reverse() : c.list;
      const w = watchedOf(slug);
      const left = all.filter((v) => !w[v.id]);
      const pages = Math.max(1, Math.ceil(left.length / PER_PAGE));

      let page = pageFromUrl;
      let focusId = null;
      if (!page) {
        // Hop to where you were: the video last opened, or the next one not yet watched after it.
        const pos = state.pos[slug] || {};
        if (pos.id) {
          const at = all.findIndex((v) => v.id === pos.id);
          if (at >= 0) {
            const next = all.slice(at).find((v) => !w[v.id]);
            if (next) { focusId = next.id; page = Math.floor(left.indexOf(next) / PER_PAGE) + 1; }
          }
        }
        if (!page) page = pos.page || 1;
        page = Math.min(Math.max(1, page), pages);
        history.replaceState(null, '', `#/c/${encodeURIComponent(slug)}?page=${page}`);
      }
      page = Math.min(Math.max(1, page), pages);
      const lastId = (state.pos[slug] || {}).id;
      if (!focusId && lastId && left.some((v) => v.id === lastId)) focusId = lastId;

      document.title = `${c.name} — Watch`;
      let leftN = left.length;
      const leftCount = el('span', { class: 'sub' }, `${n0(left.length)} left`);
      bar.replaceChildren(
        el('a', { class: 'btn', href: '#/', 'aria-label': 'All channels' }, '← Channels'),
        el('h1', {}, c.name), leftCount);

      const start = (page - 1) * PER_PAGE;
      const shown = left.slice(start, start + PER_PAGE);

      const goto = (p) => {
        state.pos[slug] = { page: p, t: Date.now() }; save();
        location.hash = `#/c/${encodeURIComponent(slug)}?page=${p}`;
      };
      const pager = () => el('nav', { class: 'pager', 'aria-label': 'Pages' },
        el('button', { type: 'button', disabled: page <= 1, on: { click: () => goto(page - 1) } }, '← ' + (order === 'old' ? 'Earlier' : 'Newer')),
        el('label', {}, el('span', { class: 'visually-hidden' }, 'Page'),
          el('select', { on: { change: (e) => goto(Number(e.target.value)) } },
            Array.from({ length: pages }, (_, i) => el('option', { value: i + 1, selected: i + 1 === page }, `Page ${i + 1} of ${pages}`)))),
        el('button', { type: 'button', disabled: page >= pages, on: { click: () => goto(page + 1) } }, (order === 'old' ? 'Later' : 'Older') + ' →'));

      const markOpened = (id) => { state.pos[slug] = { id, page, t: Date.now() }; save(); };

      const row = (v) => {
        const li = el('li', { id: `v-${v.id}`, class: v.id === focusId ? 'here' : '' });
        const playBtn = el('button', { type: 'button' }, 'Play here');
        playBtn.addEventListener('click', () => {
          const open = li.querySelector('.player');
          if (open) { open.remove(); playBtn.textContent = 'Play here'; return; }
          markOpened(v.id);
          li.append(el('div', { class: 'player' }, el('iframe', {
            src: `https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}?autoplay=1&rel=0&playsinline=1`,
            title: v.title, allow: 'autoplay; encrypted-media; picture-in-picture; fullscreen', allowfullscreen: true,
          })));
          playBtn.textContent = 'Close player';
        });
        const doneBtn = el('button', { type: 'button', class: 'primary' }, 'Watched');
        doneBtn.addEventListener('click', () => {
          w[v.id] = today(); save();
          li.remove();
          leftN -= 1;
          leftCount.textContent = `${n0(Math.max(0, leftN))} left`;
          toast(`Marked watched: ${v.title}`, () => { delete w[v.id]; save(); route(); });
          if (!main.querySelector('.videos li')) route();
        });
        li.append(
          el('a', { class: 'title', href: watchUrl(v.id), target: '_blank', rel: 'noopener noreferrer', on: { click: () => markOpened(v.id) } }, v.title),
          el('div', { class: 'meta' }, [
            (v.approx ? 'about ' : '') + niceDate(v.date),
            duration(v.secs),
          ].filter(Boolean).join(' · ')),
          el('div', { class: 'actions' }, playBtn, doneBtn),
        );
        return li;
      };

      const sortBtn = el('button', { type: 'button', on: { click: () => {
        state.order[slug] = order === 'old' ? 'new' : 'old';
        state.pos[slug] = { page: 1, t: Date.now() }; save();
        location.hash = `#/c/${encodeURIComponent(slug)}?page=1`;
      } } }, order === 'old' ? 'Showing oldest first' : 'Showing newest first');

      const parts = [
        el('div', { class: 'tools' }, sortBtn, el('a', { class: 'btn', href: c.channelUrl, target: '_blank', rel: 'noopener noreferrer' }, 'Channel on YouTube')),
      ];
      if (left.length === 0) {
        parts.push(el('p', { class: 'empty' }, `All ${n0(all.length)} videos in this list are marked watched.`));
      } else {
        parts.push(
          el('p', { class: 'range' }, `${n0(start + 1)}–${n0(start + shown.length)} of ${n0(left.length)} not yet watched` +
            (c.cutoff ? ` · list stops before ${niceDate(c.cutoff)}` : '')),
          pager(),
          el('ul', { class: 'plain videos' }, shown.map(row)),
          pager(),
        );
      }
      if (!storageOk) parts.unshift(el('p', { class: 'note' }, 'This browser is refusing to save, so Watched marks and your place will be lost on reload.'));
      main.replaceChildren(...parts);

      const target = focusId && document.getElementById(`v-${focusId}`);
      if (target) target.scrollIntoView({ block: 'center' });
      else window.scrollTo(0, 0);
    }

    // ---------- backup and restore ----------
    function backupSection() {
      const box = el('textarea', { 'aria-label': 'Backup text', spellcheck: 'false' });
      const count = Object.values(state.watched).reduce((n, m) => n + Object.keys(m).length, 0);
      return el('details', {},
        el('summary', {}, `Back up or restore (${n0(count)} marked watched)`),
        el('p', { class: 'note' },
          'Your watched list and your place in each channel are kept in this browser only. ' +
          'Clearing the browser\'s data, or a private window, starts over. Keep a copy here, and paste it back on another phone or browser.'),
        el('div', { class: 'tools' },
          el('button', { type: 'button', on: { click: async () => {
            const text = JSON.stringify({ ...state, savedAt: new Date().toISOString() });
            box.value = text;
            try { await navigator.clipboard.writeText(text); toast('Backup copied.'); }
            catch { box.select(); toast('Backup is in the box below. Copy it from there.'); }
          } } }, 'Copy backup'),
          el('button', { type: 'button', on: { click: () => {
            const blob = new Blob([JSON.stringify({ ...state, savedAt: new Date().toISOString() })], { type: 'application/json' });
            const a = el('a', { href: URL.createObjectURL(blob), download: `watch-backup-${today()}.json` });
            document.body.append(a); a.click(); a.remove();
          } } }, 'Download backup'),
        ),
        el('p', { class: 'note' }, 'To restore, paste a backup below. It is added to what is here; nothing already marked watched is unmarked.'),
        box,
        el('div', { class: 'tools' }, el('button', { type: 'button', class: 'primary', on: { click: () => {
          let incoming;
          try { incoming = JSON.parse(box.value); } catch { toast('That is not a backup from this page.'); return; }
          if (!incoming || typeof incoming.watched !== 'object') { toast('That is not a backup from this page.'); return; }
          let added = 0;
          for (const [slug, ids] of Object.entries(incoming.watched || {})) {
            const mine = watchedOf(slug);
            for (const [id, d] of Object.entries(ids || {})) if (!mine[id]) { mine[id] = d; added++; }
          }
          for (const [slug, p] of Object.entries(incoming.pos || {})) {
            if (!state.pos[slug] || (p && p.t > (state.pos[slug].t || 0))) state.pos[slug] = p;
          }
          for (const [slug, o] of Object.entries(incoming.order || {})) if (!state.order[slug]) state.order[slug] = o;
          if (!state.recent && incoming.recent) state.recent = incoming.recent;
          save();
          toast(`Restored. ${n0(added)} added as watched.`);
          route();
        } } }, 'Restore')),
      );
    }

    route();
  })();
  </script>
</body>
</html>
