name: Collect a channel's uploads

# Builds a feed carrying every upload of a YouTube channel, not the newest
# handful its own feed carries.
#
# A channel's feed gives a reader what is recent and nothing else, so somebody
# who only wants videos up to a date they trust cannot get there: the videos
# they want never arrive, and no filter in a reader reaches what was never
# delivered. This collects the channel's upload list into channels/ and the
# deploy turns it into a feed at https://chargingthefuture.github.io/rss-feeds/youtube/<slug>.xml.
#
# Run it with a channel to add one, or with the box empty to refresh every
# channel already collected. Newly found videos are added; an entry already in
# the archive is left exactly as it is.
#
# A channel can carry a cutoff date. The archive still collects everything, but
# the feed stops at that date: videos dated on or after it are never written
# into it, so nothing after the date reaches a reader at all. The date is kept
# on refresh; give the channel and a new date to change it. What a cutoff means
# is in DISCLAIMER.md: one reader's own decision about their own reading.
#
# No API key. yt-dlp reads the channel's list as metadata — it never touches a
# video. Dates come from relative labels ("2 years ago") and are approximate.
#
# YouTube refuses a data center address from time to time. A run that comes back
# with nothing writes nothing and fails loudly, leaving what is already
# collected untouched.
#
# main takes changes only through a pull request, so a run that finds something
# new opens one. Merging it publishes the feed.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to add or refresh — @handle or full address. Leave empty to refresh every channel already collected.'
        required: false
        type: string
      cutoff:
        description: 'Optional, with a channel: YYYY-MM-DD. The feed then stops there — videos dated on or after it are left out. Kept on later refreshes.'
        required: false
        type: string
  schedule:
    # Weekly, Sundays. New uploads matter little here — the archive is for what
    # came before — so this only keeps the list from drifting far behind.
    - cron: '20 5 * * 0'

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    name: Collect uploads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp
        run: pipx install yt-dlp

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect
        env:
          CHANNEL: ${{ inputs.channel }}
          CUTOFF: ${{ inputs.cutoff }}
        run: |
          if [ -n "$CUTOFF" ] && [ -z "$CHANNEL" ]; then
            echo "::error title=Cutoff needs a channel::A cutoff names a date for one channel. Give the channel beside it."
            exit 1
          fi
          if [ -n "$CHANNEL" ] && [ -n "$CUTOFF" ]; then
            pnpm collect -- --channel "$CHANNEL" --cutoff "$CUTOFF"
          elif [ -n "$CHANNEL" ]; then
            pnpm collect -- --channel "$CHANNEL"
          else
            pnpm collect
          fi

      - name: Open a pull request with what changed
        # main takes changes only through a pull request, so the refresh goes
        # onto a branch of its own and waits there for a person to merge it.
        # The merge is a push to main, which starts the deploy.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          CUTOFF: ${{ inputs.cutoff }}
        run: |
          # `git status --porcelain` rather than `git diff`: a newly collected
          # channel is a file git has never seen, and `git diff` reports no
          # change for a file it is not tracking.
          if [ -z "$(git status --porcelain -- channels)" ]; then
            echo "Nothing new."
            exit 0
          fi
          if [ -n "$CHANNEL" ]; then
            title="chore: collect the uploads of $CHANNEL"
          else
            title='chore: refresh the collected uploads'
          fi
          branch="collect/run-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add channels
          git commit -m "$title"
          git push -u origin "$branch"
          body="Collected by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          if [ -n "$CUTOFF" ]; then
            body="$body Feed cut before $CUTOFF."
          fi
          if ! gh pr create --base main --head "$branch" --title "$title" --body "$body"; then
            echo "::warning title=Pull request not opened::The branch $branch is pushed, but opening its pull request was refused. Open it from the branch on GitHub. To let this workflow open it, turn on Settings → Actions → General → Allow GitHub Actions to create and approve pull requests."
          fi

      - name: Say where the feeds are
        run: |
          {
            echo "### Collected channels"
            echo ""
            for file in channels/*.json; do
              [ -e "$file" ] || continue
              slug=$(basename "$file" .json)
              count=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('$file','utf8')).videos.length))")
              cutoff=$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('$file','utf8')).cutoff || ''))")
              if [ -n "$cutoff" ]; then
                echo "- \`$slug\` — $count videos collected, feed cut before $cutoff — https://chargingthefuture.github.io/rss-feeds/youtube/$slug.xml"
              else
                echo "- \`$slug\` — $count videos — https://chargingthefuture.github.io/rss-feeds/youtube/$slug.xml"
              fi
            done
            echo ""
            echo "Subscribe to one of those in a reader. A feed with a cutoff needs no filter; one without takes \`pubdate:/YYYY-MM-DD\` in FreshRSS's search box."
            echo ""
            echo "Dates are approximate — read from relative labels on the channel page — so leave a month or two of margin around a cutoff."
          } | tee -a "$GITHUB_STEP_SUMMARY"
